<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2C"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M32 4 L54 14 C54 36 44 52 32 60 C20 52 10 36 10 14 Z" fill="url(#shieldGrad)" stroke="#374151" stroke-width="2.5" />
  
  <!-- Safe Corridor Path -->
  <path d="M22 46 C24 38 28 34 32 30 C36 26 40 22 42 16" fill="none" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Night Beacon / Safe Haven Pulse -->
  <circle cx="32" cy="30" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="42" cy="16" r="3" fill="#F59E0B" />
  <circle cx="22" cy="46" r="3" fill="#3B82F6" />
</svg>
