<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="50%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="1050" cy="150" r="320" fill="#10B981" opacity="0.08" filter="url(#cardGlow)" />
  <circle cx="200" cy="500" r="280" fill="#F59E0B" opacity="0.06" filter="url(#cardGlow)" />

  <!-- SurakshitPath Badge Shield -->
  <g transform="translate(100, 100)">
    <path d="M40 8 L72 22 C72 56 56 80 40 92 C24 80 8 56 8 22 Z" fill="#1A1F2C" stroke="#F59E0B" stroke-width="3" />
    <circle cx="40" cy="46" r="8" fill="#10B981" />
  </g>

  <!-- Brand Typography -->
  <text x="195" y="152" fill="#F9FAFB" font-family="'Inter', sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SurakshitPath</text>
  <text x="195" y="185" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="20" font-weight="500">सुरक्षितपथ · Transparent Safe-Route Planning for Night Travel</text>

  <!-- Headline -->
  <text x="100" y="290" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Smart Night Navigation Driven by Real
  </text>
  <text x="100" y="355" fill="url(#accentGrad)" font-family="'Inter', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
    Lighting, Vibrant Frontage & Safe Havens
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="280" height="52" rx="26" fill="#1E2433" stroke="#374151" stroke-width="1.5" />
    <text x="35" y="32" fill="#10B981" font-family="'Inter', sans-serif" font-size="18" font-weight="700">✦ Anti-Redlining Scoring</text>

    <!-- Pill 2 -->
    <rect x="300" y="0" width="280" height="52" rx="26" fill="#1E2433" stroke="#374151" stroke-width="1.5" />
    <text x="335" y="32" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="18" font-weight="700">✦ Explainable TreeSHAP</text>

    <!-- Pill 3 -->
    <rect x="600" y="0" width="310" height="52" rx="26" fill="#1E2433" stroke="#374151" stroke-width="1.5" />
    <text x="630" y="32" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="18" font-weight="700">✦ UN SDGs 5 &amp; 11 Aligned</text>
  </g>

  <!-- Footer Banner -->
  <line x1="100" y1="540" x2="1100" y2="540" stroke="#2D3748" stroke-width="1" />
  <text x="100" y="580" fill="#9CA3AF" font-family="'Inter', sans-serif" font-size="18" font-weight="500">
    Pune Metropolitan Region Testbed: Tathawade · Hinjawadi · Aundh · Shivajinagar · Kothrud
  </text>
  <text x="1000" y="580" fill="#F59E0B" font-family="'Roboto Mono', monospace" font-size="18" font-weight="700" text-anchor="end">
    surakshitpath.org
  </text>
</svg>
